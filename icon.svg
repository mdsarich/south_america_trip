<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="tripGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#tripGrad)"/>
  
  <!-- Compass / Globe ring subtle -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="6" stroke-dasharray="12 8"/>
  <circle cx="256" cy="256" r="200" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>

  <!-- Flight Path Arc -->
  <path d="M 120 340 C 140 180, 260 140, 370 170" fill="none" stroke="rgba(56, 189, 248, 0.5)" stroke-width="6" stroke-dasharray="10 8" stroke-linecap="round"/>

  <!-- Stylized Airplane Icon in Center -->
  <g transform="translate(256, 240) rotate(-35) translate(-256, -240)">
    <path d="M 256 120 L 285 220 L 390 260 L 390 285 L 285 265 L 285 345 L 320 370 L 320 395 L 256 380 L 192 395 L 192 370 L 227 345 L 227 265 L 122 285 L 122 260 L 227 220 Z" 
          fill="#ffffff" 
          filter="drop-shadow(0px 8px 16px rgba(0,0,0,0.3))"/>
  </g>

  <!-- Destination pin marker -->
  <circle cx="370" cy="170" r="14" fill="#38bdf8" />
  <circle cx="370" cy="170" r="6" fill="#ffffff" />

  <!-- Subtitle badge text -->
  <rect x="146" y="405" width="220" height="36" rx="18" fill="rgba(255,255,255,0.12)"/>
  <text x="256" y="429" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="3">TRIPIT PRO</text>
</svg>
